[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "report-automation-engine"
version = "0.1.0"
description = "Deterministic processing engine for versioned report modules"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "pyarrow>=17,<26",
    "pypdf>=5,<7",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-openpyxl>=3.1",
]
render = ["playwright>=1.47"]

[tool.pytest.ini_options]
testpaths = ["tests", "reports"]
pythonpath = ["."]
markers = ["render: tests requiring installed Playwright Chromium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "reports"]
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = [
    "reports.cash_operations_dashboard.v1.report",
    "reports.cash_operations_dashboard.v1.tests.*",
    "reports.deposits_withdrawals_bonus_dashboard.v1.report",
    "reports.deposits_withdrawals_bonus_dashboard.v1.tests.*",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "reports*"]

[tool.setuptools.package-data]
"reports.registration_dashboard.v1" = [
    "manifest.json",
    "column_mapping.json",
    "templates/*.css",
    "templates/*.html",
    "assets/*.jpeg",
    "tests/*.json",
]
"reports.deposits_withdrawals_bonus_dashboard.v1" = [
    "templates/*.css",
    "templates/*.html",
    "assets/*.jpeg",
    "assets/*.ttf",
    "assets/*.txt",
]
"reports.cash_operations_dashboard.v1" = [
    "templates/*.css",
    "templates/*.html",
    "assets/*.jpeg",
    "assets/*.ttf",
    "assets/*.txt",
]
