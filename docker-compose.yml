services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ".:/var/www/html:ro"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [app]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: report_automation
      POSTGRES_USER: report_automation
      POSTGRES_PASSWORD: local-development-only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_automation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-worker:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    command: ["php", "artisan", "queue:work", "redis", "--queue=report-processing", "--tries=4", "--backoff=30,120,300"]
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on:
      app: {condition: service_started}
      redis: {condition: service_healthy}
      report-engine: {condition: service_healthy}
    restart: unless-stopped

  scheduler:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    command: ["php", "artisan", "schedule:work"]
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    depends_on: [app]
    restart: unless-stopped

  report-engine:
    build: {context: ., dockerfile: docker/report-engine/Dockerfile}
    volumes:
      - "./report-engine:/engine"
      - "./storage/app/private/reports:/reports"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
